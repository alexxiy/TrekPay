# Flatpak manifest for the Astronaut Linux build.
#
# Put next to this file before building:
#   bundle/            the Linux release bundle (build/linux/x64/release/bundle)
#   org.kerrigan.astronaut.png  a 512x512 app icon (asset_sources/icon/astronaut/icon.png, resized)
#
#   flatpak-builder --user --install build-dir org.kerrigan.astronaut.yaml
app-id: org.kerrigan.astronaut
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: astronaut

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # GPU, and the camera for the QR scanner (OpenCV opens /dev/video*).
  - --device=all
  # Wallet data lives in ~/.astronaut.
  - --filesystem=~/.astronaut:create
  # Secure storage (libsecret).
  - --talk-name=org.freedesktop.secrets

modules:
  - name: astronaut
    buildsystem: simple
    build-commands:
      # Install the Flutter bundle under /app/lib/astronaut/ so the binary's
      # $ORIGIN/lib and $ORIGIN/data lookups resolve.
      - mkdir -p /app/lib/astronaut
      - install -Dm755 bundle/astronaut /app/lib/astronaut/astronaut
      - cp -r bundle/lib bundle/data /app/lib/astronaut/
      # Wrapper so the Flatpak command resolves to the binary.
      - install -Dm755 astronaut.sh /app/bin/astronaut
      - install -Dm644 org.kerrigan.astronaut.desktop
          /app/share/applications/org.kerrigan.astronaut.desktop
      - install -Dm644 org.kerrigan.astronaut.metainfo.xml
          /app/share/metainfo/org.kerrigan.astronaut.metainfo.xml
      - install -Dm644 org.kerrigan.astronaut.png
          /app/share/icons/hicolor/512x512/apps/org.kerrigan.astronaut.png
    sources:
      - type: dir
        path: .
